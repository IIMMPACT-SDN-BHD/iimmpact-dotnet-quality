name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # SDK 10 builds; the 8.0 runtime runs the net8.0 tool and tests.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build iimmpact-dotnet-quality.slnx -c Release
      - run: dotnet test iimmpact-dotnet-quality.slnx -c Release --no-build
      - name: Fixture end-to-end
        run: bash scripts/verify-fixture.sh
