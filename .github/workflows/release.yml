name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg=$(grep -oPm1 '(?<=<Version>)[^<]+' src/IIMMPACT.CodeQuality/IIMMPACT.CodeQuality.csproj)
          tool=$(grep -oPm1 '(?<=<Version>)[^<]+' src/IIMMPACT.CodeQuality.Tool/IIMMPACT.CodeQuality.Tool.csproj)
          test "$tag" = "v$pkg"
          test "$tag" = "v$tool"
      - run: dotnet pack src/IIMMPACT.CodeQuality -o artifacts -c Release
      - run: dotnet pack src/IIMMPACT.CodeQuality.Tool -o artifacts -c Release
      - name: NuGet login (OIDC)
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
